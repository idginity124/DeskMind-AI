services:
  deskmind:
    build: .
    ports:
      # Keep localhost-only. No authentication or multi-user isolation is provided.
      - "127.0.0.1:8000:8000"
    environment:
      DESKMIND_DATA_DIR: /app/.deskmind
    volumes:
      - deskmind-data:/app/.deskmind
      - hf-model-cache:/app/.cache/huggingface
    restart: unless-stopped
volumes:
  deskmind-data:
  hf-model-cache:
